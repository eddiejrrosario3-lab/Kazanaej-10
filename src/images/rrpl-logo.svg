<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f242d"/>
      <stop offset="70%" stop-color="#0d0e12"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>
    
    <linearGradient id="redRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e61919"/>
      <stop offset="50%" stop-color="#b30000"/>
      <stop offset="100%" stop-color="#800000"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e0e6ed"/>
      <stop offset="100%" stop-color="#9aa0a6"/>
    </linearGradient>

    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3333"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.8"/>
    </filter>

    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="#fff" flood-opacity="0.15"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>

    <!-- Arc Path for Curved Text at Bottom -->
    <!-- Center is (250, 250), radius ~195 -->
    <path id="textArcBottom" d="M 68,250 A 182,182 0 0,0 432,250" fill="none"/>
  </defs>

  <!-- Outer Black Badge Base -->
  <circle cx="250" cy="250" r="240" fill="url(#bgGrad)" stroke="#2a2e38" stroke-width="4" filter="url(#dropShadow)"/>

  <!-- Red Outer Ring / Arc on lower half -->
  <path d="M 40,250 A 210,210 0 0,0 460,250 L 410,250 A 160,160 0 0,1 90,250 Z" fill="url(#redRingGrad)"/>

  <!-- Inner Dark Circle Frame -->
  <circle cx="250" cy="250" r="160" fill="#12151c" stroke="#333842" stroke-width="3"/>

  <!-- Red Crown -->
  <path d="M 220,185 L 205,150 L 232,168 L 250,145 L 268,168 L 295,150 L 280,185 Z" fill="url(#crownGrad)" stroke="#ff4d4d" stroke-width="1.5"/>

  <!-- Two Facing MC Profiles (Left & Right) -->
  <g fill="#dce1e8" stroke="#12151c" stroke-width="2" filter="url(#dropShadow)">
    <!-- Left Profile Facing Right -->
    <path d="M 140,220 C 140,220 155,200 185,200 C 205,200 220,210 222,225 C 224,235 210,240 215,255 C 218,265 228,270 225,280 C 220,295 195,305 180,305 C 170,305 165,330 165,330 L 140,310 Z"/>
    <!-- Eye & Details Left -->
    <path d="M 195,228 L 210,232 L 198,238 Z" fill="#12151c"/>
    <path d="M 188,255 L 208,255" stroke="#12151c" stroke-width="3"/>

    <!-- Right Profile Facing Left -->
    <path d="M 360,220 C 360,220 345,200 315,200 C 295,200 280,210 278,225 C 276,235 290,240 285,255 C 282,265 272,270 275,280 C 280,295 305,305 320,305 C 330,305 335,330 335,330 L 360,310 Z"/>
    <!-- Eye & Details Right -->
    <path d="M 305,228 L 290,232 L 302,238 Z" fill="#12151c"/>
    <path d="M 312,255 L 292,255" stroke="#12151c" stroke-width="3"/>
  </g>

  <!-- Metallic RRPL Title Top -->
  <g filter="url(#dropShadow)">
    <text x="250" y="125" font-family="'Impact', 'Arial Black', sans-serif" font-size="92" font-weight="900" font-style="italic" fill="url(#textGrad)" text-anchor="middle" letter-spacing="4" stroke="#000" stroke-width="3">
      RRPL
    </text>
    <!-- Registered Symbol ® -->
    <text x="382" y="72" font-family="sans-serif" font-size="22" font-weight="bold" fill="#b0b7c0">®</text>
  </g>

  <!-- Curved Text "REIS DO ROMPIMENTO PRIMEIRA LIGA" along bottom red arc -->
  <text font-family="'Impact', 'Arial Black', 'Trebuchet MS', sans-serif" font-size="26" font-weight="900" fill="#ffffff" letter-spacing="3" filter="url(#dropShadow)">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      REIS DO ROMPIMENTO PRIMEIRA LIGA
    </textPath>
  </text>
</svg>
